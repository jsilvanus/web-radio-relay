# MediaMTX configuration for the relay (see README, "MediaMTX").
#
# Used with bluenviron/mediamtx:1.15.1-ffmpeg. The plain image is scratch-based
# (only the /mediamtx binary), so the run-on-ready hooks below could not run there.
#
# Secrets are not written in this file. docker-compose passes HOOK_SECRET into the
# container and sets MTX_AUTHHTTPADDRESS, an environment override that wins over
# authHTTPAddress below, so the auth URL carries the secret from the environment.
# Run-on hooks read $HOOK_SECRET from the same environment.

logLevel: info

api: yes
apiAddress: :9997

metrics: no

rtmp: yes
rtmpAddress: :1935

# RTMPS (TLS) listener. The file keeps encryption off: MediaMTX refuses to start with
# encryption on when the certificate files are missing. docker-compose sets
# MTX_RTMPENCRYPTION=optional (both RTMP and RTMPS listen) only when the deploy
# variable RTMPS_ENABLED is on, and the certificate directory is mounted at /certs.
# Keys verified against the MediaMTX v1.15.1 sample configuration (mediamtx.yml).
rtmpEncryption: "no"
rtmpsAddress: :1937
rtmpServerKey: /certs/rtmps.key
rtmpServerCert: /certs/rtmps.crt

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: no
webrtc: no

# SRT (UDP) listener. Off in the file; docker-compose sets MTX_SRT=yes only when the
# deploy variable SRT_ENABLED is on. Publishers authenticate with the streamid
# (publish:live/<name>:<user>:<token>); see README "Publishing from a phone".
srt: no
srtAddress: :8890

authMethod: http
authHTTPAddress: "http://api:3000/internal/mediamtx/auth?secret=${HOOK_SECRET}"
authHTTPExclude: []

pathDefaults:
  overridePublisher: no

paths:
  # Only live/<name> paths are accepted; anything else is refused.
  "~^live/[a-z0-9_-]{1,32}(-cc)?$":
    runOnReady: 'wget -q -O - --post-data= --header "x-hook-secret: $HOOK_SECRET" "http://api:3000/internal/mediamtx/ready?path=$MTX_PATH"'
    runOnReadyRestart: no
    runOnNotReady: 'wget -q -O - --post-data= --header "x-hook-secret: $HOOK_SECRET" "http://api:3000/internal/mediamtx/notready?path=$MTX_PATH"'
