<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --accent: #1f6feb; --line: #d9d9d4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #efefea; --muted: #9a9a94; --accent: #6aa7ff; --line: #33332f; }
  }
  :root[data-theme="dark"] { --bg: #161615; --fg: #efefea; --muted: #9a9a94; --accent: #6aa7ff; --line: #33332f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin-inline: auto;
  }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.25rem; margin: 0; }
  .status { color: var(--muted); font-size: 0.9rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button, select {
    font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; min-height: 44px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; }
  audio { width: 100%; }
  #captions {
    flex: 1; min-height: 240px; border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .caption { margin: 0; font-size: 1.15rem; }
  .caption small { display: block; color: var(--muted); font-size: 0.8rem; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  @media (max-width: 420px) { .caption { font-size: 1.05rem; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Radio</h1>
  <span class="status" id="status" aria-live="polite">Ei yhteyttä</span>
</header>

<div class="controls">
  <button class="primary" id="play" type="button">Kuuntele</button>
  <label>Lähetys
    <select id="stream" aria-label="Lähetys"></select>
  </label>
  <label>Kieli
    <select id="lang">
      <option value="fi">suomi</option>
      <option value="sv">svenska</option>
      <option value="en">English</option>
      <option value="">kaikki</option>
    </select>
  </label>
</div>

<audio id="audio" controls preload="none"></audio>

<section id="captions" aria-live="polite" aria-label="Tekstitykset">
  <p class="empty" id="empty">Tekstitykset näkyvät tässä, kun lähetys on käynnissä.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  // Streams live under /api/streams/<name>; the page sits next to the API.
  var POLL_MS = 1000;
  var MAX_LINES = 200;

  var audio = document.getElementById('audio');
  var playButton = document.getElementById('play');
  var streamSelect = document.getElementById('stream');
  var langSelect = document.getElementById('lang');
  var statusEl = document.getElementById('status');
  var titleEl = document.getElementById('title');
  var captionsEl = document.getElementById('captions');
  var emptyEl = document.getElementById('empty');

  var hls = null;
  var pollTimer = null;
  var cursor = null;          // the relay's `next`, passed back as ?from=
  var pollToken = 0;          // changes on switching stream or language, so stale replies are dropped
  var retryTimer = null;
  var playing = false;

  // ?stream=messu and ?lang=sv pick the start values.
  var params = new URLSearchParams(location.search);
  var initialStream = params.get('stream');
  var initialLang = params.get('lang');
  if (initialLang !== null) selectValue(langSelect, initialLang);

  function selectValue(select, value) {
    for (var i = 0; i < select.options.length; i++) {
      if (select.options[i].value === value) select.selectedIndex = i;
    }
  }

  function streamBase() {
    return '/api/streams/' + encodeURIComponent(streamSelect.value);
  }

  function setStatus(text) { statusEl.textContent = text; }

  function loadStreams() {
    fetch('/api/streams', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        streamSelect.innerHTML = '';
        body.streams.forEach(function (s) {
          var o = document.createElement('option');
          o.value = s.name;
          o.textContent = s.name + (s.live ? '' : ' (ei lähetystä)');
          streamSelect.appendChild(o);
        });
        if (initialStream) selectValue(streamSelect, initialStream);
        if (!streamSelect.options.length) {
          var none = document.createElement('option');
          none.value = 'stream';
          none.textContent = 'stream';
          streamSelect.appendChild(none);
        }
        titleEl.textContent = streamSelect.value || 'Radio';
      })
      .catch(function () { setStatus('Ei yhteyttä palvelimeen'); });
  }

  function startStream() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    var url = streamBase() + '/hls/delayed.m3u8';
    if (window.Hls && Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls({ lowLatencyMode: false });
      hls.loadSource(url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.ERROR, function (_e, data) {
        if (!data.fatal) return;
        setStatus('Yhteys katkesi, yritetään uudelleen');
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else scheduleRetry();
      });
    } else {
      // Safari plays HLS natively.
      audio.src = url;
    }
    audio.play().catch(function () { setStatus('Paina Toista, selain esti äänen'); });
  }

  function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = setTimeout(startStream, 3000);
  }

  function stopStream() {
    if (hls) { hls.destroy(); hls = null; }
    audio.removeAttribute('src');
    audio.load();
  }

  playButton.addEventListener('click', function () {
    playing = true;
    playButton.disabled = true;
    startStream();
    startPolling();
    setStatus('Kuuntelet');
  });

  audio.addEventListener('error', function () {
    if (playing && !hls) scheduleRetry();
  });

  // Switching stream: stop the old audio, clear the captions, start again.
  streamSelect.addEventListener('change', function () {
    titleEl.textContent = streamSelect.value;
    pollToken++;
    cursor = null;
    clearCaptions();
    if (playing) {
      stopStream();
      startStream();
      poll();
    }
    refreshStatus();
  });

  // Live status of the chosen stream: whether it is on air, and its delay.
  function refreshStatus() {
    fetch(streamBase() + '/status', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.live === false) setStatus('Lähetys ei ole käynnissä');
        else if (playing) setStatus('Kuuntelet · viive ' + s.delaySeconds + ' s');
      })
      .catch(function () { setStatus('Ei yhteyttä palvelimeen'); });
  }

  function startPolling() {
    if (pollTimer) return;
    refreshStatus();
    pollTimer = setInterval(poll, POLL_MS);
    poll();
  }

  function poll() {
    var token = pollToken;
    var url = streamBase() + '/captions?limit=200';
    if (langSelect.value) url += '&lang=' + encodeURIComponent(langSelect.value);
    if (cursor !== null) url += '&from=' + cursor;
    fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (body) {
        if (token !== pollToken) return; // stream or language changed while in flight
        cursor = body.next;
        body.captions.forEach(addCaption);
      })
      .catch(function () { /* the next poll retries; status shows outages */ });
  }

  function clearCaptions() {
    captionsEl.innerHTML = '';
    emptyEl = document.createElement('p');
    emptyEl.className = 'empty';
    emptyEl.textContent = 'Tekstitykset näkyvät tässä, kun lähetys on käynnissä.';
    captionsEl.appendChild(emptyEl);
  }

  // Captions are released by the relay at the same delayed moment as the audio,
  // so each one is shown as soon as it arrives.
  function addCaption(c) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var p = document.createElement('p');
    p.className = 'caption';
    p.textContent = c.text;
    var meta = document.createElement('small');
    meta.textContent = c.lang.toUpperCase();
    p.appendChild(meta);
    captionsEl.appendChild(p);
    while (captionsEl.children.length > MAX_LINES) captionsEl.removeChild(captionsEl.firstChild);
    captionsEl.scrollTop = captionsEl.scrollHeight;
  }

  langSelect.addEventListener('change', function () {
    pollToken++;
    cursor = null;
    poll();
  });

  loadStreams();
})();
</script>
</body>
</html>
