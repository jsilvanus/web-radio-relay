# Production compose for the church VPS (riksunsrk shared infra pattern).
# Traefik (riksunsrk/infra) terminates TLS and routes ${DOMAIN} to nginx;
# nothing but RTMP ingest (MediaMTX) is published on the host.
services:
  nginx:
    image: ghcr.io/${IMAGE_REPO:-jsilvanus}/web-radio-relay-nginx:${IMAGE_TAG:-latest}
    container_name: web-radio-relay-nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-512m}   # the VPS has 4 GB shared with all apps
    environment:
      STATS_API_URL: "http://api:3000"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN}"
      DELAY_MAX_SECONDS: "${DELAY_MAX_SECONDS:-60}"
    # RTMP ingest moved to the mediamtx service below. nginx-rtmp keeps its RTMP
    # listener on the internal network only, for rollback: restore a port mapping
    # here and point the publisher back at it.
    volumes:
      - radio-hls:/var/www/radio/hls
      - radio-archive:/var/www/radio/archive
      - radio-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-radio-relay.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web-radio-relay.entrypoints=websecure"
      - "traefik.http.routers.web-radio-relay.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-radio-relay.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - traefik-public

  # ---------------------------------------------------------------------------
  # mediamtx — RTMP ingest (publish auth + ready hooks call the api)
  # Config: mediamtx/mediamtx.yml (must be on the VPS next to this file).
  # Upstream image, pinned; the -ffmpeg variant has the shell and wget the hooks need.
  # RTSP 8554 and the API 9997 are on the internal network only, not published.
  # ---------------------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:1.15.1-ffmpeg
    container_name: web-radio-relay-mediamtx
    restart: unless-stopped
    mem_limit: ${MEDIAMTX_MEM_LIMIT:-128m}
    command: ["/mediamtx.yml"]
    ports:
      # RTMP is not HTTP, so Traefik cannot carry it. Bind to the address you want
      # publishers to reach (loopback by default, for a tunnel); restrict with the host firewall.
      - "${RTMP_BIND:-127.0.0.1}:${RTMP_PORT:-1935}:1935"
    environment:
      HOOK_SECRET: "${HOOK_SECRET}"
      # Overrides authHTTPAddress in mediamtx.yml so the secret comes from the env.
      MTX_AUTHHTTPADDRESS: "http://api:3000/internal/mediamtx/auth?secret=${HOOK_SECRET}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      - api
    networks:
      - default
      - traefik-public

  api:
    image: ghcr.io/${IMAGE_REPO:-jsilvanus}/web-radio-relay-api:${IMAGE_TAG:-latest}
    container_name: web-radio-relay-api
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-256m}
    environment:
      PORT: "3000"
      HLS_DIR: /var/www/radio/hls
      ARCHIVE_DIR: /var/www/radio/archive
      HIDDEN_ARCHIVE_DIR: /var/www/radio/hidden_archive
      STATS_FILE: /var/www/radio/stats/stats.json
      STALE_MS: "${STALE_MS:-30000}"
      ARCHIVE_URL_PREFIX: "${ARCHIVE_URL_PREFIX:-/archive}"
      ARCHIVE_AGE_DAYS: "${ARCHIVE_AGE_DAYS:-0}"
      HIDDEN_ARCHIVE_DELETE_DAYS: "${HIDDEN_ARCHIVE_DELETE_DAYS:-0}"
      STATS_SESSION_DAYS: "${STATS_SESSION_DAYS:-90}"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN}"
      METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN}"
      DELAY_SECONDS: "${DELAY_SECONDS:-0}"
      DELAY_MAX_SECONDS: "${DELAY_MAX_SECONDS:-60}"
      DEFAULT_STREAM: "${DEFAULT_STREAM:-keskuskirkko}"
      CAPTION_RETENTION_SECONDS: "${CAPTION_RETENTION_SECONDS:-3600}"
      GATEWAY_EVENTS_URL: "${GATEWAY_EVENTS_URL:-}"
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      GATEWAY_CAPTION_STREAM: "${GATEWAY_CAPTION_STREAM:-}"
      HOOK_SECRET: "${HOOK_SECRET}"
      RADIO_SOURCE_URL_TEMPLATE: "${RADIO_SOURCE_URL_TEMPLATE:-rtsp://mediamtx:8554/live/{name}}"
    volumes:
      - radio-hls:/var/www/radio/hls:ro
      - radio-archive:/var/www/radio/archive
      - radio-hidden-archive:/var/www/radio/hidden_archive
      - radio-stats:/var/www/radio/stats
      - relay-data:/var/lib/relay
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      # Prometheus (riksunsrk/infra) scrapes web-radio-relay-api:3000/metrics over this network.
      - traefik-public

volumes:
  radio-hls:
  radio-archive:
  radio-hidden-archive:
  radio-logs:
  radio-stats:
  relay-data:

networks:
  traefik-public:
    external: true
