services:
  # ---------------------------------------------------------------------------
  # nginx-rtmp  — RTMP ingestion + HLS / archive HTTP serving
  # ---------------------------------------------------------------------------
  nginx:
    image: alfg/nginx-rtmp:latest   # nginx with nginx-rtmp-module pre-built
    restart: unless-stopped
    # RTMP ingest is now MediaMTX (service "mediamtx" below). nginx-rtmp keeps its
    # RTMP listener on the internal network only, for rollback: to publish to
    # nginx again, restore a "${RTMP_PORT:-1935}:1935" mapping here and point the
    # publisher back at it.
    ports:
      - "${HTTP_PORT:-8080}:8080"   # HTTP         (HLS stream + archive browser)
    environment:
      STATS_API_URL: "http://api:3000"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN:-}"
      DELAY_MAX_SECONDS: "${DELAY_MAX_SECONDS:-60}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts:/opt/tuberadio/scripts:ro
      - radio-hls:/var/www/radio/hls
      - radio-archive:/var/www/radio/archive
      - radio-logs:/var/log/nginx
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # mediamtx — RTMP ingest (publish auth + ready hooks call the api)
  # Config: mediamtx/mediamtx.yml. Image is the -ffmpeg variant because the
  # ready/notready hooks run wget through a shell (the plain image has neither).
  # RTSP 8554 and the API 9997 are on the internal network only, not published.
  # ---------------------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:1.15.1-ffmpeg
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    ports:
      - "${RTMP_BIND:-127.0.0.1}:${RTMP_PORT:-1935}:1935"   # RTMP ingest (publishers)
    environment:
      HOOK_SECRET: "${HOOK_SECRET:-}"
      # Overrides authHTTPAddress in mediamtx.yml so the secret comes from the env.
      MTX_AUTHHTTPADDRESS: "http://api:3000/internal/mediamtx/auth?secret=${HOOK_SECRET:-}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # api  — Node.js status & archive JSON API (proxied by nginx at /api/)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      HLS_DIR: /var/www/radio/hls
      ARCHIVE_DIR: /var/www/radio/archive
      HIDDEN_ARCHIVE_DIR: /var/www/radio/hidden_archive
      LOG_DIR: /var/log/tuberadio
      RADIO_SOURCE_URL_TEMPLATE: "${RADIO_SOURCE_URL_TEMPLATE:-rtsp://mediamtx:8554/live/{name}}"
      HOOK_SECRET: "${HOOK_SECRET:-}"
      STALE_MS: "${STALE_MS:-30000}"
      ARCHIVE_URL_PREFIX: "${ARCHIVE_URL_PREFIX:-/archive}"
      ARCHIVE_AGE_DAYS: "${ARCHIVE_AGE_DAYS:-0}"
      HIDDEN_ARCHIVE_DELETE_DAYS: "${HIDDEN_ARCHIVE_DELETE_DAYS:-0}"
      STATS_FILE: /var/www/radio/stats/stats.json
      STATS_SESSION_DAYS: "${STATS_SESSION_DAYS:-90}"
      RELAY_API_TOKEN: "${RELAY_API_TOKEN:-}"
      DELAY_SECONDS: "${DELAY_SECONDS:-0}"
      DELAY_MAX_SECONDS: "${DELAY_MAX_SECONDS:-60}"
      DEFAULT_STREAM: "${DEFAULT_STREAM:-stream}"
      CAPTION_RETENTION_SECONDS: "${CAPTION_RETENTION_SECONDS:-3600}"
      GATEWAY_EVENTS_URL: "${GATEWAY_EVENTS_URL:-}"
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      GATEWAY_CAPTION_STREAM: "${GATEWAY_CAPTION_STREAM:-}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-}"
      EMAIL_TO: "${EMAIL_TO:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      MAILGUN_API_KEY: "${MAILGUN_API_KEY:-}"
      MAILGUN_DOMAIN: "${MAILGUN_DOMAIN:-}"
    volumes:
      - radio-hls:/var/www/radio/hls
      - radio-archive:/var/www/radio/archive
      - radio-hidden-archive:/var/www/radio/hidden_archive
      - radio-stats:/var/www/radio/stats
      - radio-logs:/var/log/tuberadio
      - relay-data:/var/lib/relay

volumes:
  radio-hls:
  radio-archive:
  radio-hidden-archive:
  radio-logs:
  radio-stats:
  relay-data:
