# =============================================================================
# Tuberadio — Nginx RTMP + HTTP configuration
#
# Listens for an RTMP stream on port 1935 (application: live).
# When a publisher connects, on-publish.sh is called, which launches FFmpeg to:
#   • produce an HLS audio-only stream  →  /var/www/radio/hls/stream.m3u8
#   • archive the full transmission     →  /var/www/radio/archive/<timestamp>.mp3
#
# HTTP on port 8080 serves:
#   /hls/     — live HLS segments
#   /archive/ — archived MP3 recordings (directory listing)
#   /api/     — status / archive API  (proxied to Node.js on port 3000)
# =============================================================================

# The exec'd ingest scripts inherit the worker's user and must create
# directories under /var/www/radio and /var/log/tuberadio (root-owned volumes).
# Without this they run as nobody, mkdir fails and no stream ever starts.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ---------------------------------------------------------------------------
# RTMP block — receive the incoming RTMP push from the fan-out project
# ---------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        timeout    30s;

        application live {
            live on;
            record off;

            # Drop any video track at the RTMP level so only audio reaches the
            # exec'd FFmpeg process (belt-and-suspenders; FFmpeg also uses -vn).
            drop_idle_publisher 10s;

            # Called when a publisher (e.g. the YouTube fan-out project) starts
            # streaming.  $name is the stream key, e.g. "stream".
            # Publish check (P2.3). Answers 200 unless PUBLISH_AUTH=on on the API
            # and the token lacks stream:<name>:publish. nginx.conf cannot read
            # env, so __HOOK_SECRET__ must be replaced with HOOK_SECRET before
            # nginx starts; until something does that, keep PUBLISH_AUTH off
            # (the hook then answers 200 without checking the secret).
            on_publish        http://api:3000/internal/publish-auth?secret=__HOOK_SECRET__;

            # Called when a publisher (e.g. the YouTube fan-out project) starts
            # streaming.  $name is the stream key, e.g. "stream".
            exec_push         /opt/tuberadio/scripts/on-publish.sh $name;

            # Called when the publisher disconnects.
            exec_publish_done /opt/tuberadio/scripts/on-publish-done.sh $name;
        }
    }
}

# ---------------------------------------------------------------------------
# HTTP block — serve HLS, archives, and proxy to the Node.js status API
# ---------------------------------------------------------------------------
http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # Logging
    access_log /var/log/nginx/access.log;

    server {
        listen      8080;
        server_name _;

        root /var/www/radio;

        # Internal hooks (MediaMTX, nginx-rtmp) are reached on the Docker
        # network only. Without this block the catch-all below would proxy them
        # to the API from the public side (Traefik forwards every host path here).
        location ^~ /internal/ {
            return 404;
        }

        # ------------------------------------------------------------------
        # HLS audio stream
        # ------------------------------------------------------------------
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }

            # Disable caching — HLS manifests change every few seconds
            add_header Cache-Control no-cache always;
            add_header Pragma        no-cache always;

            # Allow any origin so the embeddable widget can be served from a
            # different domain
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        }

        # ------------------------------------------------------------------
        # Archived MP3 recordings
        # ------------------------------------------------------------------
        location /archive/ {
            autoindex            on;
            autoindex_exact_size off;
            autoindex_localtime  on;

            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        }

        # ------------------------------------------------------------------
        # Status / archive JSON API — forwarded to the Node.js server.
        # In Docker Compose the upstream is the "api" service.
        # On bare metal, change this to http://127.0.0.1:3000.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://api:3000;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Listener page (audio plus captions) is served by the API
        location = /listen {
            proxy_pass         http://api:3000;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
        }

        # OPTIONS pre-flight for CORS, fallback to Node.js API
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
                return 204;
            }
            try_files $uri @api;
        }

        location @api {
            proxy_pass         http://api:3000;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
        }
    }
}
